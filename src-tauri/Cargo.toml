[package]
name = "maido"
version = "0.2.0"
description = "Markdown and Mermaid reader with a shell beside the docs"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "maido_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
tauri = { version = "2.12.4", features = ["protocol-asset"] }
serde_json = "1"
comrak = { version = "0.57.0", default-features = false }
syntect = "5.3.0"
ammonia = "4.2.4"
ignore = "0.4.33"
notify = "8.2.0"
notify-debouncer-full = "0.7.0"
blake3 = "1.8.7"
tauri-plugin-opener = "2.7.2"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.54.0", features = ["sync", "time"] }
portable-pty = "0.9.0"
similar = "3.2.0"
nucleo-matcher = "0.3.1"
grep-searcher = "0.1.17"
grep-regex = "0.1.14"
grep-matcher = "0.1.9"
tauri-plugin-dialog = "2.8.3"
base64 = "0.23.1"
tauri-plugin-clipboard-manager = "2.5.0"
trash = "5.2.9"

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2.0"

[target.'cfg(any(target_os = "linux", target_os = "macos", target_os = "windows"))'.dependencies]
tauri-plugin-single-instance = "2.5.4"
tauri-plugin-updater = "2.14.0"
