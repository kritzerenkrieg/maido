[workspace]
resolver = "3"
members = ["src-tauri"]

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.90"

# rfd 0.16.0 with one change: the folder dialog's button reads "Select" (src-tauri/vendor/rfd).
[patch.crates-io]
rfd = { path = "src-tauri/vendor/rfd" }

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = true
